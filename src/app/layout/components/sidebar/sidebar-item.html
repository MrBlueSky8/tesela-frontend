@if (item().route; as route) {
  <a
    class="ni"
    [routerLink]="route"
    routerLinkActive="on"
    [routerLinkActiveOptions]="{ exact: item().exact ?? false }"
    [title]="collapsed() ? item().label : ''"
  >
    @if (item().icon; as icon) {
      @if (icon.type === 'tabler') {
        <i class="ti ti-{{ icon.name }}" aria-hidden="true"></i>
      } @else {
        <span class="ni-dot" [style.background]="icon.color" aria-hidden="true"></span>
      }
    }

    @if (!collapsed()) {
      <span class="ni-label">{{ item().label }}</span>
    }
  </a>
} @else {
  <button
    class="ni"
    type="button"
    (click)="onClick()"
    [title]="collapsed() ? item().label : ''"
    [attr.aria-expanded]="item().children?.length ? expandedId() === item().id : null"
  >
    @if (item().icon; as icon) {
      @if (icon.type === 'tabler') {
        <i class="ti ti-{{ icon.name }}" aria-hidden="true"></i>
      } @else {
        <span class="ni-dot" [style.background]="icon.color" aria-hidden="true"></span>
      }
    }

    @if (!collapsed()) {
      <span class="ni-label">{{ item().label }}</span>
    }

    @if (item().children?.length && !collapsed()) {
      <i
        class="ti ti-chevron-down ni-chev"
        [class.ni-chev--open]="expandedId() === item().id"
        aria-hidden="true"
      ></i>
    }
  </button>
}

@if (item().children?.length && expandedId() === item().id && !collapsed()) {
  <div class="ni-children">
    @for (child of item().children; track child.id) {
      <app-sidebar-item
        [item]="child"
        [collapsed]="collapsed()"
        [expandedId]="expandedId()"
        (toggleExpand)="toggleExpand.emit($event)"
        (actionTriggered)="actionTriggered.emit($event)"
      />
    }
  </div>
}
