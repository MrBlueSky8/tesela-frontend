<nav class="bn" aria-label="Navegacion movil principal">
  @for (item of primaryItems(); track item.id) {
    <button
      class="bn-item"
      type="button"
      [class.bn-item--active]="isItemActive(item)"
      (click)="onPrimaryItemClick(item)"
    >
      @if (item.icon; as icon) {
        @if (icon.type === 'tabler') {
          <i class="ti ti-{{ icon.name }} bn-ico" aria-hidden="true"></i>
        } @else {
          <span class="bn-dot" [style.background]="icon.color" aria-hidden="true"></span>
        }
      }

      <span class="bn-label">{{ item.label }}</span>
    </button>
  }

  @if (overflowItems().length) {
    <button
      class="bn-item"
      type="button"
      [class.bn-item--active]="isOverflowMenuOpen()"
      (click)="onOverflowClick()"
    >
      <i class="ti ti-dots bn-ico" aria-hidden="true"></i>
      <span class="bn-label">Mas</span>
    </button>
  }
</nav>

@if (isMenuOpen()) {
  <button class="bn-backdrop" type="button" aria-label="Cerrar menu" (click)="closeMenu()"></button>

  <section
    class="bn-sheet"
    [class.bn-sheet--dragging]="isSheetDragging()"
    [style.transform]="sheetTransform()"
    aria-label="Menu movil secundario"
  >
    <div
      class="bn-sheet-grip"
      (pointerdown)="onSheetPointerDown($event)"
      (pointermove)="onSheetPointerMove($event)"
      (pointerup)="onSheetPointerUp($event)"
      (pointercancel)="onSheetPointerCancel($event)"
    >
      <div class="bn-sheet-handle"></div>

      <div class="bn-sheet-hdr">
        @if (canGoBack()) {
          <button class="ib" type="button" aria-label="Volver" (click)="goBack()">
            <i class="ti ti-arrow-left" aria-hidden="true"></i>
          </button>
        } @else {
          <span class="bn-sheet-spacer"></span>
        }

        <strong class="bn-sheet-title">{{ currentMenu()?.title }}</strong>

        <button class="ib" type="button" aria-label="Cerrar" (click)="closeMenu()">
          <i class="ti ti-x" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <div class="bn-sheet-body ts-scroll">
      @for (item of currentMenu()?.items ?? []; track item.id) {
        <button
          class="bn-sheet-item"
          type="button"
          [class.bn-sheet-item--active]="isItemActive(item)"
          (click)="onMenuItemClick(item)"
        >
          <span class="bn-sheet-main">
            @if (item.icon; as icon) {
              @if (icon.type === 'tabler') {
                <i class="ti ti-{{ icon.name }} bn-sheet-ico" aria-hidden="true"></i>
              } @else {
                <span class="bn-dot" [style.background]="icon.color" aria-hidden="true"></span>
              }
            }

            <span class="bn-sheet-label">{{ item.label }}</span>
          </span>

          @if (item.children?.length) {
            <i class="ti ti-chevron-right bn-sheet-chev" aria-hidden="true"></i>
          }
        </button>
      }
    </div>
  </section>
}
